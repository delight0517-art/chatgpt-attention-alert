name: Validate desktop companions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift and zsh syntax
        run: |
          swiftc -typecheck plugin/companion/macos/alert.swift
          swiftc -typecheck plugin/companion/macos/appearance-settings.swift
          zsh -n plugin/companion/macos/chatgpt-attention-alert
      - name: Check analytics script and worker
        run: |
          node --check docs/assets/market-analytics.js
          node analytics/worker/test.mjs
          python3 -c 'import sqlite3; db=sqlite3.connect(":memory:"); db.executescript(open("analytics/worker/migrations/0001_marketing_event_daily.sql").read()); print("D1 schema SQL OK")'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $files = @('Install-Windows.ps1', 'plugin/companion/windows/alert.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          }
